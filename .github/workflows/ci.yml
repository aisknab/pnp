name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
          set-safe-directory: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install current package
        run: npm ci --ignore-scripts

      - name: Check current JavaScript surface
        run: npm run check

      - name: Test current authority and archive boundary
        run: npm test

      - name: Run conservative verifier
        run: npm run pnp:verify -- --no-write --skip-unit-tests

      - name: Check documentation links
        run: node tools/check-doc-links.mjs

      - name: Verify checks did not rewrite tracked files
        run: |
          git diff --check
          git diff --exit-code
