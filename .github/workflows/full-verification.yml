name: full-verification

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: full-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify formal reconstruction status
        run: |
          node pcc-formal-reconstruction-status0.mjs --json
          node pcc-formal-public-surface0.mjs --json

      - name: Run full test suite
        run: npm test

      - name: Verify tracked files were not rewritten
        run: |
          git diff --check
          git diff --exit-code
