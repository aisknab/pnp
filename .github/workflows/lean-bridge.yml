  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
          set-safe-directory: false

      - name: Install hosted-runner report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-recommended

      - name: Install pinned Elan and Lean
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          archive="$RUNNER_TEMP/elan-v4.2.3.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "$ELAN_ARCHIVE_SHA256  $archive" | sha256sum -c -
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify exact tool versions
        run: |
          elan --version | tee /tmp/elan-version.txt
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          grep -F 'elan 4.2.3 (b6cec7e10' /tmp/elan-version.txt
          grep -F 'Lean (version 4.31.0' /tmp/lean-version.txt
          grep -F '68218e876d2a38b1985b8590fff244a83c321783' /tmp/lean-version.txt
          grep -F 'Lake version 5.0.0-src+68218e8 (Lean version 4.31.0)' /tmp/lake-version.txt

      - name: Audit explicit root and assumption inventory
        run: node --test audits/lean-root-target0.test.mjs audits/lean-concrete-machine0.test.mjs audits/lean-concrete-tape-handoff0.test.mjs audits/lean-concrete-tape-blank-equivalence0.test.mjs audits/lean-concrete-pipeline-tape-geometry0.test.mjs audits/lean-concrete-pipeline-input-framer0.test.mjs audits/lean-concrete-pipeline-output-handoff0.test.mjs audits/lean-concrete-pipeline-state-namespace0.test.mjs audits/lean-concrete-pipeline-sequential-state-namespace0.test.mjs audits/lean-concrete-pipeline-sequential-compiler0.test.mjs audits/lean-concrete-pipeline-stage-bridges0.test.mjs audits/lean-concrete-terminal-output-packer0.test.mjs audits/lean-concrete-pipeline-terminal-bridge0.test.mjs audits/lean-concrete-pipeline-paired-compiler0.test.mjs audits/lean-concrete-pipeline-compiler0.test.mjs audits/lean-concrete-pipeline-machine-simulation0.test.mjs audits/lean-concrete-complexity0.test.mjs audits/lean-concrete-pipeline-refinement0.test.mjs audits/lean-concrete-cnf0.test.mjs audits/lean-concrete-cook-levin-layout0.test.mjs audits/lean-concrete-cook-levin-tableau0.test.mjs audits/lean-nand-semantics0.test.mjs audits/lean-nand-enumerator0.test.mjs audits/lean-nand-reference-minimum0.test.mjs audits/lean-locked-nand-baseline0.test.mjs audits/lean-locked-nand-threshold-boundary0.test.mjs audits/lean-residual-routes0.test.mjs audits/lean-theorem-inventory0.test.mjs audits/formal-publication0.test.mjs

      - name: Audit uniform bounded verifier-tableau source
        run: node --test audits/lean-concrete-cook-levin-verifier-tableau0.test.mjs

      - name: Audit finite local Cook-Levin CNF compiler source
        run: node --test audits/lean-concrete-cook-levin-local-cnf0.test.mjs

      - name: Audit finite whole-tableau Cook-Levin CNF source
        run: node --test audits/lean-concrete-cook-levin-tableau-cnf0.test.mjs

      - name: Audit finite whole-tableau Cook-Levin CNF semantics
        run: node --test audits/lean-concrete-cook-levin-tableau-cnf-semantics0.test.mjs

      - name: Audit finite Cook-Levin raw-tape bridge
        run: node --test audits/lean-concrete-cook-levin-raw-tape-bridge0.test.mjs

      - name: Audit external Cook-Levin formula-size bound
        run: node --test audits/lean-concrete-cook-levin-formula-size0.test.mjs

      - name: Audit rectangular Cook-Levin formula schedule
        run: node --test audits/lean-concrete-cook-levin-formula-schedule0.test.mjs

      - name: Audit direct Cook-Levin formula cursor
        run: node --test audits/lean-concrete-cook-levin-formula-cursor0.test.mjs

      - name: Audit literal Cook-Levin builder input-length tally
        run: node --test audits/lean-concrete-cook-levin-builder-input-length0.test.mjs

      - name: Audit executable Cook-Levin builder input prefix
        run: node --test audits/lean-concrete-cook-levin-builder-input-prefix0.test.mjs

      - name: Audit standalone Cook-Levin builder token appender
        run: node --test audits/lean-concrete-cook-levin-builder-token-appender0.test.mjs

      - name: Audit composed Cook-Levin builder first-token prefix
        run: node --test audits/lean-concrete-cook-levin-builder-first-token-prefix0.test.mjs

      - name: Audit composed Cook-Levin complete width header
        run: node --test audits/lean-concrete-cook-levin-builder-complete-header0.test.mjs

      - name: Build explicit PNP root
        run: lake build PNP

      - name: Re-export compiled theorem inventory
        run: npm run formal:inventory:check

      - name: Verify generated publication status and report source
        run: npm run formal:publication:check

      - name: Rebuild and verify canonical report PDF
        run: npm run report:check

      - name: Print root and conditional-bridge axioms
        run: lake env lean -DwarningAsError=true lean-audit/PNPBridgeAxiomAudit.lean

      - name: Print concrete bitstring and polynomial-kernel axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcreteBitStringAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Concrete bitstring and polynomial kernel unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 41

      - name: Print concrete finite-rule machine axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcreteMachineAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Concrete finite-rule machine kernel unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 38

      - name: Print concrete complexity axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcreteComplexityAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Concrete complexity layer unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 48

      - name: Print blank-delimited output and pure handoff axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcreteTapeHandoffAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Blank-delimited output or pure handoff target unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 14

      - name: Print blank-materialization equivalence axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcreteTapeBlankEquivalenceAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Blank-materialization equivalence unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 21
          lake env lean -DwarningAsError=true lean-regression/PNPConcreteTapeBlankEquivalence.lean

      - name: Print boundary-marked pipeline tape geometry axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcretePipelineTapeGeometryAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Boundary-marked pipeline tape geometry unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 20

      - name: Print executable all-input framer axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcretePipelineInputFramerAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Executable all-input framer unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 70

      - name: Print executable internal output-handoff axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcretePipelineOutputHandoffAxiomAudit.lean 2>&1)"
