name: lean-bridge

on:
  pull_request:
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lean/**'
      - 'lean-audit/**'
      - 'audits/lean-root-target0.test.mjs'
      - 'audits/lean-nand-semantics0.test.mjs'
      - 'audits/lean-nand-enumerator0.test.mjs'
      - 'audits/lean-nand-reference-minimum0.test.mjs'
      - 'audits/lean-locked-nand-baseline0.test.mjs'
      - 'docs/lean_bridge.md'
      - 'docs/lean_nand_semantics.md'
      - 'docs/lean_nand_enumerator.md'
      - 'docs/lean_nand_reference_minimum.md'
      - 'docs/lean_locked_nand_macros.md'
      - 'docs/lean_locked_nand_prefix.md'
      - 'docs/lean_locked_nand_baseline.md'
      - '.github/workflows/lean-bridge.yml'
  push:
    branches:
      - main
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lean/**'
      - 'lean-audit/**'
      - 'audits/lean-root-target0.test.mjs'
      - 'audits/lean-nand-semantics0.test.mjs'
      - 'audits/lean-nand-enumerator0.test.mjs'
      - 'audits/lean-nand-reference-minimum0.test.mjs'
      - 'audits/lean-locked-nand-baseline0.test.mjs'
      - 'docs/lean_bridge.md'
      - 'docs/lean_nand_semantics.md'
      - 'docs/lean_nand_enumerator.md'
      - 'docs/lean_nand_reference_minimum.md'
      - 'docs/lean_locked_nand_macros.md'
      - 'docs/lean_locked_nand_prefix.md'
      - 'docs/lean_locked_nand_baseline.md'
      - '.github/workflows/lean-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
          set-safe-directory: false

      - name: Install pinned Elan and Lean
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          archive="$RUNNER_TEMP/elan-v4.2.3.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "$ELAN_ARCHIVE_SHA256  $archive" | sha256sum -c -
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify exact tool versions
        run: |
          elan --version | tee /tmp/elan-version.txt
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          grep -F 'elan 4.2.3 (b6cec7e10' /tmp/elan-version.txt
          grep -F 'Lean (version 4.31.0' /tmp/lean-version.txt
          grep -F '68218e876d2a38b1985b8590fff244a83c321783' /tmp/lean-version.txt
          grep -F 'Lake version 5.0.0-src+68218e8 (Lean version 4.31.0)' /tmp/lake-version.txt

      - name: Audit explicit root and assumption inventory
        run: node --test audits/lean-root-target0.test.mjs audits/lean-nand-semantics0.test.mjs audits/lean-nand-enumerator0.test.mjs audits/lean-nand-reference-minimum0.test.mjs audits/lean-locked-nand-baseline0.test.mjs

      - name: Build explicit PNP root
        run: lake build PNP

      - name: Print root and conditional-bridge axioms
        run: lake env lean -DwarningAsError=true lean-audit/PNPBridgeAxiomAudit.lean

      - name: Print direct-wire NAND semantics axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPNANDSemanticsAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Direct-wire NAND semantics unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 57

      - name: Print exact-width NAND enumerator axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPNANDEnumeratorAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Exact-width NAND enumerator unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 41

      - name: Print NAND truth-table equivalence axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPNANDTruthTableAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'NAND truth-table equivalence unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 29

      - name: Print exhaustive NAND reference-minimum axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPNANDMinimumAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Exhaustive NAND reference minimum unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 27

      - name: Print concrete framed-composition axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPNANDCompositionAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Concrete framed composition unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 50

      - name: Print concrete framed-slack axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPNANDSlackAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Concrete framed slack unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 15

      - name: Print typed local locked-NAND candidate axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPLockedNANDDirectAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Typed local locked-NAND candidates unexpectedly depend on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 48

      - name: Print direct-wire output-lower-bound axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPDirectWireBaselineAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Direct-wire output lower bound unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 25

      - name: Print source-derived locked-NAND accounting axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPLockedNANDBaselineAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Source-derived locked-NAND accounting unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 23

      - name: Print finite local locked-NAND baseline axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPLockedNANDLocalBaselineAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Finite local locked-NAND baselines unexpectedly depend on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 30
