      - name: Build explicit PNP root
        run: lake build PNP

      - name: Re-export compiled theorem inventory
        run: npm run formal:inventory:check

      - name: Verify generated publication status and report source
        run: npm run formal:publication:check

      - name: Rebuild and verify canonical report PDF
        run: npm run report:check

      - name: Print root and conditional-bridge axioms
        run: lake env lean -DwarningAsError=true lean-audit/PNPBridgeAxiomAudit.lean

      - name: Print concrete bitstring and polynomial-kernel axioms
        run: |
          audit_output="$(lake env lean -DwarningAsError=true lean-audit/PNPConcreteBitStringAxiomAudit.lean 2>&1)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -F 'depends on axioms:'; then
            echo 'Concrete bitstring and polynomial kernel unexpectedly depends on axioms.' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$audit_output" | grep -Fc 'does not depend on any axioms')" -eq 41

