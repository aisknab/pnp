name: lean-bridge

on:
  pull_request:
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lean/**'
      - 'docs/lean_bridge.md'
      - 'docs/lean_locked_nand_macros.md'
      - 'docs/lean_locked_nand_prefix.md'
      - '.github/workflows/lean-bridge.yml'
  push:
    branches:
      - main
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lean/**'
      - 'docs/lean_bridge.md'
      - 'docs/lean_locked_nand_macros.md'
      - 'docs/lean_locked_nand_prefix.md'
      - '.github/workflows/lean-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
          set-safe-directory: false
      - name: Install elan and Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show Lean and Lake versions
        run: |
          lean --version
          lake --version
      - name: Build Lean bridge
        run: lake build
