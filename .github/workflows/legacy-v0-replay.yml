name: legacy-v0-replay

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the recorded 1,121-test source validation instead of the ten-file smoke
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: legacy-v0-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
          set-safe-directory: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Verify immutable archive coordinates
        run: node pcc-legacy-v0-archive0.mjs --json --no-write

      - name: Replay pinned historical checker
        env:
          FULL_REPLAY: ${{ inputs.full }}
        run: |
          args=(--output "$RUNNER_TEMP/pnp-legacy-v0-7072f8d")
          if [[ "$FULL_REPLAY" == "true" ]]; then
            args+=(--full)
          fi
          node scripts/replay-legacy-v0.mjs "${args[@]}"

      - name: Upload non-authoritative replay transcript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-v0-replay-transcript
          path: ${{ runner.temp }}/pnp-legacy-v0-7072f8d/replay-transcript.json
          if-no-files-found: error
          retention-days: 14
