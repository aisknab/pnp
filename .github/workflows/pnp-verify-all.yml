name: pnp-verify-all

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pnp-verify-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnp-verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run one-command PNP verifier
        run: node scripts/pnp-verify-all.mjs --json --skip-unit-tests
