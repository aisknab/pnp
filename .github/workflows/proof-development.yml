name: proof-development

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: proof-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Formal reconstruction status
        run: |
          node pcc-formal-reconstruction-status0.mjs --json
          node --test audits/formal-reconstruction-status0.test.mjs
      - name: Formal reconstruction public surface
        run: |
          node pcc-formal-public-surface0.mjs --json
          node --test audits/formal-public-surface0.test.mjs test/pcc-legacy-replay-gate0.test.mjs
