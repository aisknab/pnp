name: proof-development

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: proof-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Formal reconstruction status
        run: |
          node pcc-formal-reconstruction-status0.mjs --json --no-write
          node --test audits/formal-reconstruction-status0.test.mjs
      - name: Formal reconstruction public surface
        run: |
          node pcc-formal-public-surface0.mjs --json --no-write
          node --test audits/formal-public-surface0.test.mjs test/current-package-surface0.test.mjs
      - name: Pinned legacy-v0 archive integrity
        run: |
          node pcc-legacy-v0-archive0.mjs --json --no-write
          node --test audits/legacy-v0-archive0.test.mjs test/replay-legacy-v0.test.mjs
