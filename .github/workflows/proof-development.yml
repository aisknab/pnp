name: proof-development

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  proof-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Uniform final soundness target
        run: |
          npm run proof:uniform-final-soundness-target
          node --test audits/uniform-final-soundness-target0.test.mjs
      - name: Uniform input family
        run: |
          npm run proof:uniform-input-family
          node --test audits/uniform-input-family0.test.mjs
      - name: Uniform locked NAND construction
        run: |
          npm run proof:uniform-locked-nand-construction
          node --test audits/uniform-locked-nand-construction0.test.mjs
      - name: Uniform locked NAND threshold
        run: |
          npm run proof:uniform-locked-nand-threshold
          node --test audits/uniform-locked-nand-threshold0.test.mjs
      - name: Uniform residual-band minimizer
        run: |
          npm run proof:uniform-residual-band-minimizer
          node --test audits/uniform-residual-band-minimizer0.test.mjs
      - name: Uniform ZeroSlack closure
        run: |
          npm run proof:uniform-zeroslack-closure
          node --test audits/uniform-zeroslack-closure0.test.mjs
      - name: Semantic no-hidden-oracle
        run: |
          npm run proof:no-hidden-oracle-semantic
          node --test audits/no-hidden-oracle-semantic0.test.mjs
      - name: Uniform complexity conclusion
        run: |
          npm run proof:uniform-complexity-conclusion
          node --test audits/uniform-complexity-conclusion0.test.mjs
      - name: Unrestricted final soundness release
        run: |
          npm run proof:unrestricted-final-soundness-release
          node --test audits/unrestricted-final-soundness-release0.test.mjs
      - name: Upload proof-development verdicts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-development-latest-verdicts
          path: |
            artifacts/uniform-final-soundness-target/latest-verdict.json
            artifacts/uniform-input-family/latest-verdict.json
            artifacts/uniform-locked-nand-construction/latest-verdict.json
            artifacts/uniform-locked-nand-threshold/latest-verdict.json
            artifacts/uniform-residual-band-minimizer/latest-verdict.json
            artifacts/uniform-zeroslack-closure/latest-verdict.json
            artifacts/no-hidden-oracle-semantic/latest-verdict.json
            artifacts/uniform-complexity-conclusion/latest-verdict.json
            artifacts/unrestricted-final-soundness-release/latest-verdict.json
