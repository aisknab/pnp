name: public-theorem-emission-denial

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-theorem-emission-denial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run public theorem emission denial checker
        run: node pcc-public-theorem-emission-denial0.mjs --json
      - name: Run public theorem emission denial tests
        run: node --test audits/public-theorem-emission-denial0.test.mjs
      - name: Upload public theorem emission denial verdict
        uses: actions/upload-artifact@v4
        with:
          name: public-theorem-emission-denial-latest-verdict
          path: artifacts/public-theorem-emission-denial/latest-verdict.json
