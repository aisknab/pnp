name: public-theorem-emission-negative-transitions

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-theorem-emission-negative-transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run public theorem emission negative transition checker
        run: node pcc-public-theorem-emission-negative-transitions0.mjs --json
      - name: Run public theorem emission negative transition tests
        run: node --test audits/public-theorem-emission-negative-transitions0.test.mjs
      - name: Upload public theorem emission negative transition verdict
        uses: actions/upload-artifact@v4
        with:
          name: public-theorem-emission-negative-transitions-latest-verdict
          path: artifacts/public-theorem-emission-negative-transitions/latest-verdict.json
