name: public-theorem-emission-status

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-theorem-emission-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run public theorem-emission status checker
        run: node pcc-public-theorem-emission-status0.mjs --json
      - name: Run public theorem-emission status tests
        run: node --test audits/public-theorem-emission-status0.test.mjs
      - name: Upload public theorem-emission status verdict
        uses: actions/upload-artifact@v4
        with:
          name: public-theorem-emission-status-latest-verdict
          path: artifacts/public-theorem-emission-status/latest-verdict.json
