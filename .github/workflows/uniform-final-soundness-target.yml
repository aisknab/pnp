name: uniform-final-soundness-target

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  uniform-final-soundness-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check uniform final soundness target
        run: node pcc-uniform-final-soundness-target0.mjs --json
      - name: Run uniform final soundness target tests
        run: node --test audits/uniform-final-soundness-target0.test.mjs
      - name: Upload uniform final soundness target verdict
        uses: actions/upload-artifact@v4
        with:
          name: uniform-final-soundness-target-latest-verdict
          path: artifacts/uniform-final-soundness-target/latest-verdict.json
