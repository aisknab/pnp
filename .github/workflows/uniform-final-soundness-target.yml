name: uniform-final-soundness-target

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  uniform-final-soundness-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check uniform final soundness target
        run: npm run proof:uniform-final-soundness-target
      - name: Run uniform final soundness target tests
        run: node --test audits/uniform-final-soundness-target0.test.mjs
