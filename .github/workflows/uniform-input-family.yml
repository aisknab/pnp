name: uniform-input-family

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  uniform-input-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check uniform input family
        run: npm run proof:uniform-input-family
      - name: Run uniform input family tests
        run: node --test audits/uniform-input-family0.test.mjs
